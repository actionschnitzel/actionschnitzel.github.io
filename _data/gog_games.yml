# GOG-Spiele unter Linux (Quelle: forum.linuxguides.de, Community-Liste).
# Neuer Eintrag = neuer Block; die Seite sortiert alphabetisch selbst.
#
# title:    Spieltitel (Pflicht)
# via:      Liste aus: native, wine, heroic, lutris
# playable: nur setzen, wenn false (Spiel läuft nicht)
# note:     Fix / Tweak, mehrere Zeilen mit | möglich
# links:    optionale Liste aus title + url

# Beispiel für alle Einträge:
# - title: "Beispielspiel"
#   via: [native, wine, heroic, lutris]
#   playable: false
#   note: |-
#     Erste Zeile des Fixes
#     Zweite Zeile des Fixes
#   links:
#     - title: "Beispiel-Link"
#       url: "https://example.com/"


