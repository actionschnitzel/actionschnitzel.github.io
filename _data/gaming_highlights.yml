- name: Grim Dawn - Fangs of Asterkarn
  appid: 219990
  rating: Platinum
  description: "In einer düsteren Fantasywelt steht die Menschheit kurz vor dem Untergang. Eisen ist wertvoller als Gold, und Vertrauen muss man sich hart erarbeiten. Das Action-Rollenspiel bietet eine umfangreiche Charakterentwicklung, Hunderte einzigartige Gegenstände, ein Crafting-System und Quests, deren Verlauf durch eigene Entscheidungen beeinflusst wird."
- name: Dead as Disco
  appid: 3404260
  rating: Platinum
  description: "In Dead as Disco treffen Martial Arts auf Musikvideo-Ästhetik. Das neonbeleuchtete Beat ’em up verbindet actionreiche Kämpfe mit dem Rhythmus der Musik, sodass jeder Schlag, Tritt und jede Kombo im Takt ausgeführt wird. Gemeinsam mit Charlie Disco gilt es, sich den schurkischen Idols entgegenzustellen und die Band wiederzuvereinen."
- name: Arc Raiders
  appid: 1808500
  rating: Platinum
  description: "ARC Raiders ist ein Multiplayer-Extraction-Spiel, das in einer tödlichen Zukunft spielt. Die Erde wurde von einer mysteriösen Bedrohung heimgesucht: mechanischen Kreaturen, die als ARC bekannt sind."
- name: "Star Trek: Voyager - Across the Unknown"
  appid: 2643390
  rating: Platinum
  description: "Ein Traum für Star-Trek-Fans. Interaktive Adventure-Story, die sich wie eine echte Episode anfühlt."
- name: "Icy Tower"
  appid: 3014860
  rating: Platinum
  description: "Ein Klassiker der Springspiele ist zurück! Begleite Harold the Homeboy und seine Freunde beim Aufstieg den Icy Tower hinauf. Mit Combo-Sprüngen sammelst du massive Punkte. Wie hoch kommst du?"
