name: Update Steam Survey

on:
  schedule:
    # 06:00 UTC am 5. jedes Monats
    - cron: "0 6 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Steam survey data
        run: python3 scripts/fetch_steam_survey.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/steam_survey.yml
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Steam Survey aktualisiert"
            git push
          fi
