---
layout: page
title: "Gaming-Highlights 2026"
---
    <section class="section">
      <p>Alle Bilder und Daten werden von ProtonDB bezogen.</p>
      
      <table class="games-table">
        <thead>
          <tr>
            <th></th>
            <th>Spiel</th>
            <th>Proton</th>
            <th>Beschreibung</th>
          </tr>
        </thead>
        <tbody id="gamesTableBody">
          <!-- Rows will be generated dynamically -->
        </tbody>
      </table>
    </section>

  

<script>
    // Load ProtonDB ratings and populate table dynamically
    async function loadProtonDBRatings() {
      try {
        const response = await fetch('protondb-ratings.json');
        const data = await response.json();
        
        const tableBody = document.getElementById('gamesTableBody');
        tableBody.innerHTML = ''; // Clear any existing content
        
        // Generate table rows from JSON data
        data.games.forEach(game => {
          const tierClass = `proton-badge-${game.tier.toLowerCase()}`;
          const tierText = getTierText(game.tier);
          
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="game-header-img"><img src="${game.steamHeaderImage}" alt="${game.name}"></td>
            <td>${game.name}</td>
            <td><a href="${game.protondbUrl}" target="_blank" rel="noopener noreferrer"><span class="proton-badge ${tierClass}">${tierText}</span></a></td>
            <td>${game.description}</td>
          `;
          tableBody.appendChild(row);
        });
      } catch (error) {
        console.error('Could not load ProtonDB ratings:', error);
      }
    }
    
    // Get text for tier (without emoji)
    function getTierText(tier) {
      const texts = {
        'platinum': 'Platinum',
        'gold': 'Gold',
        'silver': 'Silver',
        'bronze': 'Bronze',
        'unsupported': 'Unsupported',
        'unknown': 'Check'
      };
      return texts[tier.toLowerCase()] || 'Check';
    }
    
    // Load ratings when page loads
    document.addEventListener('DOMContentLoaded', loadProtonDBRatings);
  </script>
