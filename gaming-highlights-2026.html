---
layout: page
title: "Gaming-Highlights 2026"
---
    <section class="section">
      <div class="table-scroll">
        <table class="games-table games-table-top">
          <tbody>
            {%- for game in site.data.gaming_highlights %}
            <tr>
              <td>
                <img src="/assets/images/games/steam-{{ game.appid }}-header.jpg" alt="{{ game.name }}">
                <div><a href="https://www.protondb.com/app/{{ game.appid }}" target="_blank" rel="noopener noreferrer"><span class="proton-badge proton-badge-{{ game.rating | downcase }}">{{ game.rating }}</span></a> <a class="link-pill" href="https://store.steampowered.com/app/{{ game.appid }}" target="_blank" rel="noopener noreferrer">Steam-Seite ↗</a></div>
                <small>Bild: <a href="https://store.steampowered.com/app/{{ game.appid }}" target="_blank" rel="noopener noreferrer">Steam / Valve</a></small>
              </td>
              <td><strong>{{ game.name }}</strong><br>{{ game.description }}</td>
            </tr>
            {%- endfor %}
          </tbody>
        </table>
      </div>
    </section>
