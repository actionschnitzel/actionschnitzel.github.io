<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#1d1e20">
  <link rel="icon" type="image/png" href="{{ '/assets/redesign/img/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/redesign/img/apple-touch-icon.png' | relative_url }}">
  <link rel="preload" href="{{ '/assets/redesign/fonts/inter-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/redesign/fonts/inter-latin-800-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/redesign/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#inhalt">Zum Inhalt springen</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/redesign/img/schnitzel.png' | relative_url }}" alt="" width="48" height="48">
        <span>Actionschnitzel</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menü öffnen"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <nav class="site-nav" id="site-nav" aria-label="Hauptnavigation">
        {% include nav.html %}
      </nav>
    </div>
  </header>

  {{ content }}

  {% include footer.html %}
  <script src="{{ '/assets/redesign/js/main.js' | relative_url }}" defer></script>
</body>
</html>
