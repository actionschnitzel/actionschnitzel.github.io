---
layout: default
---
<main id="inhalt">
  <section class="page-hero">
    <div class="wrap">
      {%- if page.hero_image %}
      <img src="{{ page.hero_image | relative_url }}" alt="{{ page.hero_image_alt }}" class="page-icon">
      {%- endif %}
      <h1 class="page-title">{{ page.title }}</h1>
    </div>
  </section>

  <div class="wrap article-body">
    {{ content }}
  </div>
</main>
